[pytest]
# Define test discovery patterns
testpaths = 
    agrisight/backend/apps
    agrisight/backend/agrisight

# Python files that match these patterns will be considered test files
python_files = test_*.py

# Python classes that match these patterns will be considered test classes
python_classes = Test* *Test

# Python functions that match these patterns will be considered test functions
python_functions = test_*

# Add the project root to the Python path
python_paths = .

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(name)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Test coverage configuration
addopts = 
    --cov=agrisight/backend/apps 
    --cov=agrisight/backend/agrisight 
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=80

# Django settings module
django_find_project = true
DJANGO_SETTINGS_MODULE = agrisight.backend.agrisight.settings

# Filter out deprecation warnings and other noise
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning: The default_app_config
    ignore::RuntimeWarning: 'async' and 'await' will become reserved keywords in Python 3.7
    ignore::django.utils.deprecation.RemovedInDjango40Warning

# Test markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks integration tests (run with '-m integration')
    unit: marks unit tests (run with '-m unit')
    e2e: marks end-to-end tests (run with '-m e2e')
    requires_redis: marks tests that require Redis
    requires_celery: marks tests that require Celery
    requires_db: marks tests that require database access
    requires_internet: marks tests that require internet access
